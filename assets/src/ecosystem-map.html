<!doctype html>
<!--
  Ecosystem strip. Rendered to assets/ecosystem-map.png by render.py (960 CSS px @2x).
  Seven flat bands in the sunset photo's colours: archives first, then one band per
  payload type. The big number is how many listed projects work on it.
  Designed at 960px so the smallest type stays readable at README width (~850px).
  Keep the COLS / SPECS lists below in sync with README.md when entries change.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@700&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; -webkit-font-smoothing: antialiased; }
  body { width: 960px; }
  :root { --mono: "IBM Plex Mono", ui-monospace, monospace; --sans: "IBM Plex Sans", sans-serif; --display: "Archivo", sans-serif; }

  .card { width: 960px; border-radius: 10px; overflow: hidden; background: #17132e; }
  .cols { display: grid; grid-template-columns: repeat(7, 1fr); align-items: stretch; }
  .col { padding: 18px 13px 20px; color: #fff; min-height: 372px; display: flex; flex-direction: column; }
  .col.lt { color: #1a1206; }
  .c { font: 900 44px/0.9 var(--display); letter-spacing: -0.04em; }
  .n { margin-top: 10px; white-space: nowrap; font: 700 16px/1.1 var(--display); letter-spacing: -0.01em; }
  .sp { margin-top: 5px; font: 500 10.5px/1.35 var(--mono); opacity: 0.72; min-height: 29px; }
  .tl { margin-top: 12px; padding-top: 11px; border-top: 1px solid currentColor; font: 500 12px/1.62 var(--mono); }
  .tl div { overflow-wrap: anywhere; }
  .o { margin-top: auto; padding-top: 14px; font: 700 13.5px/1.2 var(--sans); }
  .o small { display: block; margin-top: 2px; font: 500 10.5px/1.3 var(--mono); opacity: 0.78; min-height: 28px; }
  .specs { padding: 12px 13px 13px; font: 500 12px/1.4 var(--mono); color: rgba(255,255,255,0.72); }
  .specs b { font-weight: 500; color: #f7ab47; }
</style>
</head>
<body>
<div class="card">
  <div class="cols" id="cols"></div>
  <div class="specs" id="specs"></div>
</div>
<script>
const COLS = [
  {name:"Archives", spec:"RPF9 container", out:"Browse / extract", note:"start here",
   tools:["PercyStar","Percy6Stars","SixNG","6stars","rpf9-explorer","6to5m","vice-lens","gta6-explorer","OpenRPF9","OpenVI","openrage","OpenSix","forge9","leonida-forge","Lineup","rpf9-extract","zeozeozeo/rpf9"]},
  {name:"Textures", spec:"TTPF · BCPack · Gfx10", out:"PNG / DDS", note:"BC1–BC7 decoded",
   tools:["ttpf-studio","ttpf-viewer","bcpack-rs","bcpack-gpu-hlsl","bcpack-gpu-sdk","rage-texture","bcpack-decoder","SixNG","rpf9-explorer","Percy6Stars","6to5m"]},
  {name:"Audio", spec:"ADAT · AWC · Opus · XMA2", out:"WAV / Ogg", note:"Opus remux",
   tools:["rpf9-audio","AWC extractor","SixFM","RadioSimulator","audio.rpf-dump","gta6-explorer","vice-lens","bink2-decoder","RPF9-tools","PercyStar","Percy6Stars","rpf9-explorer"]},
  {name:"Video", spec:"BK2 · Bink 2", out:"Playback", note:"Windows · macOS · Linux",
   tools:["PercyStar","Percy6Stars","bink-player-mac","bink2-decoder","gta6-video-reader","BK2toMP4","ttpf-studio","rpf9-explorer","RPF9-tools"]},
  {name:"Models & maps", spec:"Drawables · placements", out:"glTF / OBJ", note:"+ map data",
   tools:["SixNG","PercyStar","Percy6Stars","rpf9-explorer","6stars","6to5m","vice-lens","OpenVI","ttpf-studio","rage9-re"]},
  {name:"Shaders", spec:"RDNA2 · GFX10.3", out:"SPIR-V / DXIL", note:"26,503 lifted",
   tools:["xcl","VIctory","OpenScarlett","xbox-emulator","Xbox2Windows","PercyScarlett","five-star-recomp","OpenScarlett CE","XSXEmu","Xenora","ScarlettCompat","AnyPS5"]},
  {name:"Executable", spec:"PE32+ · d3d12_xs · kernelx", out:"PC runtime", note:"first missions, not playable",
   tools:["VIctory","victory-fork","VIctory-macOS","Native-Victory-macOS","cool_fox","Leonida Legacy","xcl","XSEmu","ScarlettPort","OpenScarlett","xbox-emulator","TomBox","Xbox2Windows","ScarlettX","XValkyrie","TuxBox","PercyScarlett","OpenScarlett CE","five-star-recomp","AnyXboxX","Scarlight","port-of-americas","AnyBox","OpenEra","G6Recomp","ProjectReCity","Xenora","XSXEmu","GTA6-BootTest","g6shim","Xbgtasix","ScarlettCompat","nativ64","scarlett-layer","GTAVI-Recomp","AnyPS5"]},
];
const SPECS = ["GTA6-Asset-Info","gta-vi-port-research","RPF9-tools","0x52504639","rpf9-research","gta6-namehash","leonidaforge/research","gta6-hash-database","shader-census","rage-tools-vi","VI-vr-port","rdna2-dis","rdna-isa-ref","rdna2-conformance","victory-xcl-graft","leonida-framelab","ttpf-spec","xbox-hle-lab","gta6-wiki","rage9-re","gta-vi-data-dumps","StringsDatabase","gta6-modding-sdk","scripthook-vi","VIper"];
// Dusk sky at the left to the horizon at the right; the last two bands are light enough for dark text.
const BANDS = ["#1b1a45","#3b2466","#6c2a78","#a92f72","#d8475a","#f0783c","#f7ab47"];

document.getElementById("cols").innerHTML = COLS.map((l, i) => `
  <div class="col ${i >= 5 ? "lt" : ""}" style="background:${BANDS[i]}">
    <div class="c">${l.tools.length}</div>
    <div class="n">${l.name}</div>
    <div class="sp">${l.spec}</div>
    <div class="tl">${l.tools.map(t => `<div>${t}</div>`).join("")}</div>
    <div class="o">${l.out}<small>${l.note}</small></div>
  </div>`).join("");
document.getElementById("specs").innerHTML = `<b>Format specs</b> &nbsp;${SPECS.join(" · ")}`;
</script>
</body>
</html>
