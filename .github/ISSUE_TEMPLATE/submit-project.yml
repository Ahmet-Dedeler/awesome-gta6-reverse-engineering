name: Submit a Project
description: Suggest an open-source RAGE 9, RPF9, or GTA VI reverse engineering tool or format doc
title: "[Add]: "
labels: ["addition"]
body:
  - type: markdown
    attributes:
      value: |
        Submit a helpful GTA VI-related open-source project or research resource for **Awesome GTA VI Reverse Engineering**.
        Submissions linking to leaked game executables, pirated builds, or spam/malware lures will be closed.
  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - RPF9 Archive & Asset Explorers
        - Texture (.ttpf) & Audio (ADAT / AWC) Tools
        - Console Translation Layers & Static Recompilation
        - Format Documentation & Research
        - Visualizers & Related Experiments
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: Stack / Target Platform
      placeholder: Rust / Windows, macOS
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it implement?
      description: Concise, factual summary of working functionality and current status.
      placeholder: Parses RPF9 archives and decodes TTPF textures to PNG...
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: Repository contains real code, format docs, or useful resources (not an empty stub or placeholder)
          required: true
        - label: Submission is not a leaked game executable, pirated build download, or spam/malware lure
          required: true
